name: Build ANGLE

# Builds Google's ANGLE (libEGL.dll, libGLESv2.dll) from the revision in ANGLE_REVISION with
# the arguments in args.gn, and publishes them as a release with their checksums and a build
# provenance attestation. openOMSI's Windows package takes a release by its tag and checks
# the SHA-256 before it ships the DLLs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ANGLE_REVISION, args.gn, .github/workflows/build.yml, tools/build_id.py, tools/test_build_id.py]
  pull_request:
    paths: [ANGLE_REVISION, args.gn, .github/workflows/build.yml, tools/build_id.py, tools/test_build_id.py]

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  recipe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tools -p 'test_*.py' -v

  windows-x64:
    if: github.event_name != 'pull_request'
    needs: recipe-tests
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Revision
        id: rev
        shell: bash
        run: |
          python tools/build_id.py >> "$GITHUB_OUTPUT"

      - name: Already released?
        id: have
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.rev.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
          fi

      # Chromium's build (build/vs_toolchain.py) wants exactly this Windows SDK, newer than
      # the runner's: the official installer, checked against the hash winget publishes for it.
      - name: Windows SDK 10.0.28000
        if: steps.have.outputs.yes == 'false'
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/06fc99ac-527e-451e-a536-8866695a2e7e/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe"
          $want = "02988EA51EAB2A2DB53E19735E51C97A6D221ADA74B9174FA0868870B9403BA0"
          $exe = Join-Path $env:RUNNER_TEMP "winsdksetup.exe"
          Invoke-WebRequest -Uri $url -OutFile $exe
          $have = (Get-FileHash $exe -Algorithm SHA256).Hash
          if ($have -ne $want) { throw "winsdksetup.exe: SHA-256 $have, expected $want" }
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            "/features", "OptionId.DesktopCPPx64", "OptionId.DesktopCPPx86", "OptionId.WindowsDesktopDebuggers",
            "/quiet", "/norestart", "/log", (Join-Path $env:RUNNER_TEMP "winsdk.log"))
          if ($p.ExitCode -ne 0 -and $p.ExitCode -ne 3010) { Get-Content (Join-Path $env:RUNNER_TEMP "winsdk.log") -Tail 50; throw "SDK setup exit $($p.ExitCode)" }
          if (-not (Test-Path "C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0\um\windows.h")) { throw "SDK 10.0.28000.0 headers missing" }

      - name: depot_tools
        if: steps.have.outputs.yes == 'false'
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Fetch ANGLE
        if: steps.have.outputs.yes == 'false'
        shell: cmd
        run: |
          rem (depot_tools' git, python and gclient are .bat files: without `call` the first of
          rem them would end this script, with success)
          call gclient help >nul
          call git clone https://chromium.googlesource.com/angle/angle "%RUNNER_TEMP%\angle" || exit /b 1
          cd /d "%RUNNER_TEMP%\angle"
          call git checkout ${{ steps.rev.outputs.sha }} || exit /b 1
          call python3 scripts\bootstrap.py || exit /b 1
          call gclient sync --no-history -j 8 || exit /b 1
          if not exist buildtools\win\gn\gn.exe if not exist buildtools\win\gn.exe (echo gn is missing after gclient sync & exit /b 1)

      - name: Build
        if: steps.have.outputs.yes == 'false'
        shell: cmd
        run: |
          cd /d "%RUNNER_TEMP%\angle"
          if not exist out\Release mkdir out\Release
          copy /y "%GITHUB_WORKSPACE%\args.gn" out\Release\args.gn || exit /b 1
          call gn gen out\Release || exit /b 1
          call autoninja -C out\Release libEGL libGLESv2 || exit /b 1

      - name: Package
        if: steps.have.outputs.yes == 'false'
        shell: bash
        run: |
          angle="$RUNNER_TEMP/angle"
          pkg="$RUNNER_TEMP/pkg/${{ steps.rev.outputs.tag }}-windows-x64"
          mkdir -p "$pkg"
          cp "$angle/out/Release/libEGL.dll" "$angle/out/Release/libGLESv2.dll" "$pkg/"
          cp "$angle/LICENSE" "$pkg/LICENSE-ANGLE.txt"
          cp args.gn "$pkg/args.gn"
          printf 'ANGLE %s %s\nhttps://chromium.googlesource.com/angle/angle/+/%s\nBuild recipe SHA-256: %s\n' \
            "${{ steps.rev.outputs.branch }}" "${{ steps.rev.outputs.sha }}" "${{ steps.rev.outputs.sha }}" \
            "${{ steps.rev.outputs.recipe_sha256 }}" > "$pkg/REVISION.txt"
          (cd "$pkg" && sha256sum libEGL.dll libGLESv2.dll LICENSE-ANGLE.txt args.gn REVISION.txt > SHA256SUMS)
          (cd "$RUNNER_TEMP/pkg" && 7z a -tzip "${{ steps.rev.outputs.tag }}-windows-x64.zip" "${{ steps.rev.outputs.tag }}-windows-x64" >/dev/null)
          (cd "$RUNNER_TEMP/pkg" && sha256sum "${{ steps.rev.outputs.tag }}-windows-x64.zip" > "${{ steps.rev.outputs.tag }}-windows-x64.zip.sha256")
          cat "$pkg/SHA256SUMS" "$RUNNER_TEMP/pkg/${{ steps.rev.outputs.tag }}-windows-x64.zip.sha256"

      - name: Attest
        if: steps.have.outputs.yes == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            ${{ runner.temp }}/pkg/${{ steps.rev.outputs.tag }}-windows-x64.zip
            ${{ runner.temp }}/pkg/${{ steps.rev.outputs.tag }}-windows-x64/libEGL.dll
            ${{ runner.temp }}/pkg/${{ steps.rev.outputs.tag }}-windows-x64/libGLESv2.dll

      - name: Release
        if: steps.have.outputs.yes == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/pkg"
          gh release create "${{ steps.rev.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --title "ANGLE ${{ steps.rev.outputs.branch }} (${{ steps.rev.outputs.sha }})" \
            --notes "libEGL.dll and libGLESv2.dll (OpenGL ES over Direct3D 11, x64) built from ANGLE ${{ steps.rev.outputs.sha }} with args.gn. Checksums in the zip's SHA256SUMS; build provenance attested by GitHub." \
            "${{ steps.rev.outputs.tag }}-windows-x64.zip" "${{ steps.rev.outputs.tag }}-windows-x64.zip.sha256"
